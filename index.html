        const compressImage = (file, maxSize = 200) => new Promise((resolve, reject) => {
            try {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
                        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    } catch(e) { reject(e); }
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            } catch(e) { reject(e); }
        });

        const vibrate = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} };

        const sfx = {
            ctx: null,
            init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} },
            tone(f, type='sine', t=0.1) {
                this.init(); if(!this.ctx) return;
                const now = this.ctx.currentTime;
                f.forEach((fr, i) => {
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.type = type; o.frequency.value = fr;
                    g.gain.setValueAtTime(0.1, now+i*t); g.gain.exponentialRampToValueAtTime(0.01, now+i*t+0.2);
                    o.connect(g); g.connect(this.ctx.destination); o.start(now+i*t); o.stop(now+i*t+0.2);
                });
            },
            correct() { this.tone([523.25, 659.25, 783.99], 'sine'); vibrate(40); },
            wrong() { this.tone([150, 100], 'sawtooth', 0.2); vibrate([60,40,60]); },
            click() { this.tone([600], 'sine', 0.05); },
            win() { this.tone([523.25, 659.25, 783.99, 1046.50], 'triangle', 0.1); }
        };

        const speak = (text) => {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();

                u.rate = 0.95;

        const today = () => new Date().toDateString();

        const PROMO_CODES = {

        const R = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const SHUF = (a) => [...a].sort(() => Math.random() - 0.5);
        const mkQ = (topic, text, correct, wrongs, expl) => {
            const all = [String(correct), ...wrongs.map(String)];
            const uniq = [...new Set(all)];
            while (uniq.length < 4) uniq.push('X' + uniq.length);
            const shuf = SHUF(uniq.slice(0, 4));
            return { topic, text, options: shuf, correctIndex: shuf.indexOf(String(correct)), explanation: expl };
        };

        const GEN = {
            math: [
                () => { const a=R(2,10), x=R(-10,10), b=R(-20,20); return mkQ('Лінійні', `Розв'яжіть: ${a}x ${b>=0?'+ '+b:'- '+Math.abs(b)} = ${a*x+b}`, x, [x+1,x-1,x+2], `x=${x}`); },
                () => { const r1=R(1,10), r2=R(1,10); return mkQ('Квадратні', `Сума коренів x²-${r1+r2}x+${r1*r2}=0`, r1+r2, [r1*r2,-r1-r2,r1-r2], `x₁+x₂=${r1+r2}`); },
                () => { const tot=R(1,20)*100, p=R(1,9)*10; return mkQ('Відсотки', `${p}% від ${tot}`, tot*p/100, [tot*p/200, tot*(p+10)/100, tot/p|0], `${tot*p/100}`); },
                () => { const a=R(2,20), b=R(2,20); return mkQ('Площа', `Площа прямокутника ${a}×${b}`, a*b, [a+b, 2*(a+b), a*b+5], `S=${a*b}`); },
                () => { const a=R(1,9), n=R(2,4); const ps=['','x','²','³','⁴'][n]; const nps=['','','','²','³'][n]; return mkQ('Похідна', `f(x)=${a}x${ps}, f'(x)=?`, `${a*n}x${nps}`, [`${a}x${nps}`, `${a*n}x${ps}`, `${n}x`], `f'=${a*n}x${nps}`); },
                () => { const base=[2,3,10][R(0,2)], p=R(1,5); return mkQ('Логарифми', `log_${base}(${Math.pow(base,p)})`, p, [p+1,p-1,Math.pow(base,p)], `log=${p}`); },

                () => { const a=R(2,15), b=R(2,15); return mkQ('Периметр', `Периметр прямокутника ${a}×${b}`, 2*(a+b), [a+b, a*b, a+b+2], `P=${2*(a+b)}`); },

                () => mkQ('Тригонометрія', 'sin(30°)+cos(60°)=?', 1, [0.5, 1.5, 0], '0.5+0.5=1'),
                () => { const a=R(2,10); return mkQ('Квадратні', `x²=${a*a}, x>0. x=?`, a, [a+1,a-1,a*a], `x=${a}`); },
                () => { const a=R(3,20), b=R(3,20), c=a+b; return mkQ('Обчислення', `${a}+${b}=?`, c, [c+1,c-1,c+5], `${c}`); },
                () => { const a=R(2,9), b=R(2,9); return mkQ('Степені', `${a}² + ${b}²`, a*a+b*b, [a*b, (a+b)*(a+b), a*a-b*b], `${a*a+b*b}`); },
                () => { const a=R(2,8); return mkQ('Корені', `√${a*a}`, a, [a+1,a-1,a*a], `√${a*a}=${a}`); },
            ],
            ukr: [

                () => mkQ('Динаміка', 'Другий закон Ньютона:', 'F = m·a', ['E = mc²','p = mv','A = F·s'], 'F=ma'),
                () => mkQ('Електрика', 'Закон Ома:', 'I = U/R', ['U = I·R','R = U/I','P = U·I'], 'I=U/R'),

        function genQuestions(subject, count = 10) {
            const recentKey = `nmt_recent_${subject}`;
            let recent = [];
            try { recent = JSON.parse(SS.get(recentKey) || '[]'); } catch(e) {}
            const seen = new Set(recent);
            const gens = GEN[subject] || GEN.math;
            const result = []; let tries = 0;
            while (result.length < count && tries < count * 80) {
                const g = gens[R(0, gens.length - 1)];
                const q = g();
                if (!seen.has(q.text)) { seen.add(q.text); result.push(q); }
                tries++;
            }
            while (result.length < count) {
                const q = gens[R(0, gens.length - 1)]();
                q.text += ' #' + (result.length + 1);
                result.push(q);
            }
            SS.set(recentKey, JSON.stringify([...result.map(q=>q.text), ...recent].slice(0, 150)));
            return result;

            try {
                const s = SS.get('nmt_user');
                if (s) {
                    const p = JSON.parse(s);
                    const u = { ...DEFAULT_USER, ...p };
                    if (!Array.isArray(u.unlockedFrames)) u.unlockedFrames = ['f0'];
                    if (!Array.isArray(u.ownedTitles)) u.ownedTitles = ['t0'];
                    if (!Array.isArray(u.usedPromoCodes)) u.usedPromoCodes = [];
                    if (!Array.isArray(u.badges)) u.badges = [];
                    if (!Array.isArray(u.promoAttempts)) u.promoAttempts = [];
                    if (!u.bonuses || typeof u.bonuses !== 'object') u.bonuses = { b50: 1, bfreeze: 1, bskip: 1 };
                    if (!u.stats || typeof u.stats !== 'object') u.stats = { math: { correct: 0, total: 0 } };
                    if (!u.topicStats || typeof u.topicStats !== 'object') u.topicStats = {};
                    if (!u.winsBySubject || typeof u.winsBySubject !== 'object') u.winsBySubject = {};
                    if (!u.equippedFrameId) u.equippedFrameId = 'f0';
                    if (!u.equippedTitle) u.equippedTitle = 't0';
                    if (!u.backgroundId) u.backgroundId = 'b0';
                    if (typeof u.coins !== 'number' || isNaN(u.coins)) u.coins = 0;
                    if (typeof u.marathonBest !== 'number') u.marathonBest = 0;
                    if (typeof u.streak !== 'number') u.streak = 0;
                    if (typeof u.bestScore !== 'number') u.bestScore = 0;
                    if (typeof u.dailyChallengeStreak !== 'number') u.dailyChallengeStreak = 0;
                    if (typeof u.tournamentBest !== 'number') u.tournamentBest = 0;

                Object.keys(GEN).forEach(subj => {
                    GEN[subj].forEach((g, i) => allGens.push({ subj, i }));
                });
                const idx = seed % allGens.length;
                const pick = allGens[idx];
                const q = GEN[pick.subj][pick.i]();
                return { ...q, subject: pick.subj };
            };

                    if (!st[activeSubject]) st[activeSubject] = { correct: 0, total: 0 };

                                                    className={`glass-panel p-2 rounded-xl text-center ${active ? 'border-emerald-500' : ''}`}>
                                                    <div className={`w-full h-10 rounded-lg mb-1 ${bg.cls} bg-slate-800`}></div>
                                                    <p className="text-[10px] font-bold text-white truncate">{bg.name}</p>
                                                    <p className="text-[9px] text-amber-400">{active ? '✓ Активний' : owned ? 'Одягти' : `${bg.price}🪙`}</p>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <h3 className="text-sm font-bold text-white mt-4">Бонуси</h3>
                                    <div className="grid grid-cols-3 gap-2">
                                        {STORE_BONUSES.map(b => (
                                            <div key={b.id} className="glass-panel p-2 rounded-xl text-center flex flex-col">
                                                <p className="text-2xl">{b.icon}</p>
                                                <p className="text-[10px] font-bold text-white">{b.name}</p>
                                                <p className="text-[10px] text-emerald-400 mb-1">Маєте: {user.bonuses?.[b.id]||0}</p>
                                                <button type="button" onClick={() => buyBonus(b)} className="mt-auto w-full py-1.5 bg-blue-600 rounded text-[10px] text-white font-bold active:scale-95">Купити {b.price}🪙</button>
                                            </div>
                                        ))}
                                    </div>

                                    <h3 className="text-sm font-bold text-white mt-4">Титули</h3>
                                    <div className="space-y-2">
                                        {STORE_TITLES.map(t => {
                                            const owned = user.ownedTitles.includes(t.id);
                                            const equipped = user.equippedTitle === t.id;
                                            return (
                                                <div key={t.id} className="glass-panel p-3 rounded-xl flex items-center justify-between">
                                                    <div className="flex items-center space-x-2"><span className="text-2xl">{t.icon}</span><span className="text-sm font-bold text-white">{t.name}</span></div>
                                                    {equipped ? <span className="text-[10px] text-emerald-400 font-bold">✓ Активний</span>
                                                    : owned ? <button type="button" onClick={() => buyTitle(t)} className="px-3 py-1.5 bg-slate-700 rounded text-[10px] text-white font-bold">Одягти</button>
                                                    : <button type="button" onClick={() => buyTitle(t)} className="px-3 py-1.5 bg-blue-600 rounded text-[10px] text-white font-bold">Купити {t.price}🪙</button>}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <h3 className="text-sm font-bold text-white mt-4">Рамки</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {STORE_FRAMES.map(f => {
                                            const owned = user.unlockedFrames.includes(f.id);
                                            const equipped = user.equippedFrameId === f.id;
                                            return (
                                                <div key={f.id} className="glass-panel p-3 rounded-xl text-center flex flex-col">
                                                    <div className={`w-12 h-12 rounded-full mx-auto mb-2 ${f.style} bg-slate-800`}></div>
                                                    <p className="text-[10px] font-bold text-white">{f.name}</p>
                                                    {equipped ? <p className="text-[10px] text-emerald-400 font-bold py-1">✓ Активна</p>
                                                    : owned ? <button type="button" onClick={() => buyFrame(f)} className="mt-auto py-1.5 bg-slate-700 rounded text-[10px] text-white font-bold">Одягти</button>
                                                    : <button type="button" onClick={() => buyFrame(f)} className="mt-auto py-1.5 bg-blue-600 rounded text-[10px] text-white font-bold">Купити {f.price}🪙</button>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {tab === 'profile' && (
                                <div className="space-y-4">
                                    <div className="glass-panel rounded-3xl p-6 flex flex-col items-center">
                                        <div className={`w-24 h-24 rounded-full flex items-center justify-center bg-slate-900 text-4xl mb-3 overflow-hidden ${STORE_FRAMES.find(f=>f.id===user.equippedFrameId)?.style}`}>
                                            {user.avatarUrl ? <img src={user.avatarUrl} className="w-full h-full object-cover" /> : <span>{user.name[0]}</span>}
                                        </div>
                                        <h2 className="text-lg font-bold text-white">{user.name}</h2>
                                        <p className="text-xs text-amber-300 mb-1">{STORE_TITLES.find(t=>t.id===user.equippedTitle)?.icon} {STORE_TITLES.find(t=>t.id===user.equippedTitle)?.name}</p>
                                        <p className="text-xs text-slate-400 mb-2">{user.institution}</p>
                                        <p className="text-sm text-indigo-400 font-bold mb-2">🏆 {myElo} ELO • 🔥 {user.streak} днів • ⭐ {user.level} рів.</p>

                                        {badges.length > 0 && (
                                            <div className="flex flex-wrap gap-1 mt-2">
                                                {badges.map(b => BADGES[b] && (
                                                    <span key={b} className="px-2 py-1 bg-amber-500/20 text-amber-300 text-xs rounded-lg font-bold">{BADGES[b].icon} {BADGES[b].label}</span>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex gap-2 mt-3 flex-wrap justify-center">
                                            <button onClick={() => setShowEdit(true)} className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Редагувати</button>
                                            <button onClick={shareProfileCard} className="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold">📸 Поділитися</button>
                                            <button onClick={() => setTab('friends')} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">👥 Друзі ({friendsList.length})</button>
                                        </div>

                                        <div className="w-full mt-4 pt-4 border-t border-slate-700">
                                            <p className="text-xs text-slate-400 mb-2">Промокод</p>
                                            <div className="flex space-x-2">
                                                <input type="text" value={promoInput} onChange={e => setPromoInput(e.target.value)} placeholder="Введіть код" className="flex-1 border border-slate-700 rounded-xl px-3 py-2 text-sm outline-none" />
                                                <button onClick={usePromo} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">ОК</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="glass-panel rounded-3xl p-5">
                                        <h3 className="text-sm font-bold text-white mb-3">⭐ XP / Рівень</h3>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs text-slate-300">Рівень {user.level}</span>
                                            <span className="text-xs font-bold text-white">{user.xp % 100}/100 XP</span>
                                        </div>
                                        <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-gradient-to-r from-blue-500 to-purple-500" style={{width: `${(user.xp % 100)}%`}}></div>
                                        </div>
                                    </div>

                                    <div className="glass-panel rounded-3xl p-5">
                                        <h3 className="text-sm font-bold text-white mb-3">📊 Прогрес по темах</h3>
                                        {Object.keys(user.topicStats || {}).length === 0 && <p className="text-xs text-slate-500">Зіграй матч, щоб побачити прогрес</p>}
                                        {Object.entries(user.topicStats || {}).slice(0, 10).map(([key, s]) => {
                                            const [subj, ...rest] = key.split('_');
                                            const topic = rest.join('_');
                                            const a = s.total ? Math.round((s.correct / s.total) * 100) : 0;
                                            return (
                                                <div key={key} className="flex justify-between items-center mb-2">
                                                    <span className="text-xs text-slate-300 truncate flex-1">{topic}</span>
                                                    <div className="flex items-center space-x-2 ml-2">
                                                        <div className="w-20 h-2 bg-slate-800 rounded-full overflow-hidden"><div className={`h-full ${a>=70?'bg-emerald-500':a>=40?'bg-amber-500':'bg-rose-500'}`} style={{width: `${a}%`}}></div></div>
                                                        <span className="text-xs font-bold text-white w-8 text-right">{a}%</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button onClick={doLogout} className="w-full py-3 rounded-xl bg-slate-800 text-white font-bold">Вийти з акаунту</button>
                                    <button onClick={() => { SS.rem('nmt_user'); SS.rem('nmt_myid'); location.reload(); }} className="w-full py-3 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold">Скинути прогрес</button>
                                </div>
                            )}
                        </main>

                        {/* EDIT MODAL */}
                        {showEdit && (
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-5">
                                <div className="glass-panel rounded-3xl p-6 w-full max-w-sm space-y-4">
                                    <h3 className="text-lg font-bold text-white">Редагувати</h3>
                                    <div className="flex flex-col items-center mb-4">
                                        <div className={`w-24 h-24 rounded-full flex items-center justify-center bg-slate-900 text-4xl mb-2 overflow-hidden ${STORE_FRAMES.find(f=>f.id===user.equippedFrameId)?.style}`}>
                                            {user.avatarUrl ? <img src={user.avatarUrl} className="w-full h-full object-cover" /> : <span>{user.name[0]}</span>}
                                        </div>
                                        <label className="cursor-pointer text-xs text-blue-400 font-bold bg-blue-500/10 px-4 py-2 rounded-xl border border-blue-500/30 mt-2">
                                            📷 Змінити фото
                                            <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                                                const f = e.target.files[0];
                                                if (f) {
                                                    try { const c = await compressImage(f, 200); setUser(p => ({...p, avatarUrl: c})); showToast('Фото оновлено', 'success'); }
                                                    catch(err) { showToast('Помилка зображення', 'error'); }
                                                }
                                            }} />
                                        </label>
                                    </div>
                                    <input type="text" value={tempName} onChange={e => setTempName(e.target.value)} placeholder="Ім'я" className="w-full border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                    <input type="text" value={tempInst} onChange={e => setTempInst(e.target.value)} placeholder="Заклад" className="w-full border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                    <div className="flex space-x-3">
                                        <button onClick={() => setShowEdit(false)} className="flex-1 py-3 rounded-xl bg-slate-800 text-white text-sm font-bold">Відміна</button>
                                        <button onClick={() => { setUser(p => ({...p, name: tempName, institution: tempInst})); setShowEdit(false); showToast('Збережено', 'success'); }} className="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-bold">Зберегти</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* DUEL JOIN MODAL */}
                        {showDuelJoin && (
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-5">
                                <div className="glass-panel rounded-3xl p-6 w-full max-w-sm space-y-4">
                                    <h3 className="text-lg font-bold text-white">🔑 Дуель по коду</h3>
                                    <input type="text" value={duelCode} onChange={e => setDuelCode(e.target.value.replace(/\D/g,'').slice(0,6))} placeholder="6-цифровий код" maxLength={6} inputMode="numeric" className="w-full border border-slate-700 rounded-xl px-4 py-3 text-2xl text-center tracking-widest font-mono" />
                                    <div className="flex space-x-3">
                                        <button onClick={() => setShowDuelJoin(false)} className="flex-1 py-3 rounded-xl bg-slate-800 text-white text-sm font-bold">Відміна</button>
                                        <button onClick={() => { joinDuel(duelCode); setShowDuelJoin(false); }} className="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-bold">Приєднатися</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TOURNAMENT MODAL */}
                        {showTournament && (
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-5">
                                <div className="glass-panel rounded-3xl p-6 w-full max-w-sm text-center">
                                    <div className="text-6xl mb-3">🏆</div>
                                    <h3 className="text-xl font-black text-white mb-2">Турнір дня</h3>
                                    <p className="text-sm text-slate-400 mb-4">10 питань з математики. Топ-3 отримують монети!</p>
                                    <p className="text-xs text-amber-400 font-bold mb-4">Твій рекорд: {user.tournamentBest || 0}/10</p>
                                    <div className="flex space-x-3">
                                        <button onClick={() => setShowTournament(false)} className="flex-1 py-3 rounded-xl bg-slate-800 text-white text-sm font-bold">Скасувати</button>
                                        <button onClick={startTournament} className="flex-1 py-3 rounded-xl bg-amber-600 text-white text-sm font-bold">Почати</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PUBLIC PROFILE MODAL */}
                        {viewProfile && (
                            <div className="fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-5 overflow-y-auto">
                                <div className="glass-panel rounded-3xl p-6 w-full max-w-sm space-y-3 relative">
                                    <button onClick={() => setViewProfile(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-800 text-white text-sm font-bold">✕</button>
                                    <div className="flex flex-col items-center">
                                        <div className={`w-24 h-24 rounded-full flex items-center justify-center bg-slate-900 text-4xl mb-3 overflow-hidden ${STORE_FRAMES.find(f=>f.id==='f0')?.style}`}>
                                            {viewProfile.avatarUrl ? <img src={viewProfile.avatarUrl} className="w-full h-full object-cover" /> : <span>{viewProfile.name?.[0] || '?'}</span>}
                                        </div>
                                        <h2 className="text-lg font-bold text-white">{viewProfile.name || 'Гравець'}</h2>
                                        <p className="text-xs text-amber-300 mb-1">
                                            {STORE_TITLES.find(t=>t.id===viewProfile.title)?.icon} {STORE_TITLES.find(t=>t.id===viewProfile.title)?.name}
                                        </p>
                                        <p className="text-sm text-indigo-400 font-bold mb-2">🏆 {viewProfile.elo || 0} ELO</p>

                                        <div className="flex gap-3 text-xs text-slate-300 mb-3">
                                            <span>🏅 {viewProfile.wins || 0} перемог</span>
                                            <span>🎮 {viewProfile.matchesPlayed || 0} матчів</span>
                                        </div>

                                        {(viewProfile.badges || []).length > 0 && (
                                            <div className="flex flex-wrap gap-1 mb-3">
                                                {(viewProfile.badges || []).map(b => BADGES[b] && (
                                                    <span key={b} className="px-2 py-1 bg-amber-500/20 text-amber-300 text-[10px] rounded-lg font-bold">{BADGES[b].icon}</span>
                                                ))}
                                            </div>
                                        )}

                                        <div className="w-full space-y-2 mt-2">
                                            {viewProfile.id !== myId && (
                                                <>
                                                    {friends[viewProfile.id]?.status === 'accepted' ? (
                                                        <button onClick={() => removeFriend(viewProfile.id)} className="w-full py-3 rounded-xl bg-rose-600/20 text-rose-400 border border-rose-500/40 text-sm font-bold">Видалити з друзів</button>
                                                    ) : friends[viewProfile.id]?.status === 'outgoing' ? (
                                                        <button disabled className="w-full py-3 rounded-xl bg-slate-800 text-slate-400 text-sm font-bold">Заявку надіслано</button>
                                                    ) : friends[viewProfile.id]?.status === 'incoming' ? (
                                                        <button onClick={() => acceptFriendRequest(viewProfile.id)} className="w-full py-3 rounded-xl bg-emerald-600 text-white text-sm font-bold">✓ Прийняти заявку</button>
                                                    ) : (
                                                        <button onClick={() => sendFriendRequest(viewProfile.id)} className="w-full py-3 rounded-xl bg-blue-600 text-white text-sm font-bold">➕ Додати в друзі</button>
                                                    )}
                                                </>
                                            )}
                                            <button onClick={() => setViewProfile(null)} className="w-full py-3 rounded-xl bg-slate-800 text-white text-sm font-bold">Закрити</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <nav className="glass-nav px-2 py-3 flex justify-around pb-5 z-20">
                            {[{id:'home',ic:'home',l:'Головна'},{id:'topics',ic:'layers',l:'Бій'},{id:'leaderboard',ic:'trophy',l:'Топ'},{id:'friends',ic:'users',l:'Друзі'},{id:'store',ic:'shopping-bag',l:'Магазин'},{id:'profile',ic:'user',l:'Профіль'}].map(t => (
                                <button key={t.id} onClick={() => { sfx.click(); setTab(t.id); }} className={`flex flex-col items-center relative ${tab===t.id?'text-blue-500':'text-slate-500'}`}>
                                    <i data-lucide={t.ic} className="w-5 h-5"></i>
                                    <span className="text-[10px] font-bold">{t.l}</span>
                                    {t.id === 'friends' && incomingRequests.length > 0 && (
                                        <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center">{incomingRequests.length}</span>
                                    )}
                                </button>
                            ))}
                        </nav>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
